name: Build Xash3D + CS16 iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Clone ios-cmake
        run: |
          git clone --depth 1 \
            https://github.com/leetal/ios-cmake.git

      - name: Clone CS16 Client
        run: |
          git clone --recursive \
            https://github.com/Velaron/cs16-client.git \
            cs16-client

      - name: Configure CS16 Client for iOS arm64
        run: |
          cmake \
            -S cs16-client \
            -B cs16-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build CS16 Client
        run: |
          cmake \
            --build cs16-build \
            --config Release

      - name: Show CS16 output
        run: |
          echo "===== CS16 BUILD OUTPUT ====="
          find cs16-build \
            -type f \
            \( -name "*.dylib" -o -name "*.a" \) \
            -print

      - name: Upload CS16 build
        uses: actions/upload-artifact@v4
        with:
          name: cs16-ios-arm64
          path: cs16-build/
