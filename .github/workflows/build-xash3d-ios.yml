name: Build Xash3D + CS16 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja python
          brew uninstall --ignore-dependencies freetype || true
          brew uninstall --ignore-dependencies harfbuzz || true

      - name: Clone ios-cmake
        run: |
          git clone --depth 1 \
            https://github.com/leetal/ios-cmake.git

      - name: Build FreeType for iOS arm64
        run: |
          git clone --depth 1 --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git freetype

          cmake -S freetype -B freetype-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/freetype-ios" \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE

          cmake --build freetype-build --config Release
          cmake --install freetype-build --config Release

      - name: Clone SDL2
        run: |
          git clone --depth 1 --branch SDL2 --recursive \
            https://github.com/libsdl-org/SDL.git SDL

      - name: Build SDL2 iOS framework
        run: |
          cd SDL/Xcode/SDL

          xcodebuild \
            -project SDL.xcodeproj \
            -scheme "Framework-iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/sdl-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          test -d "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework"

      - name: Clone Xash3D FWGS
        run: |
          git clone --recursive \
            https://github.com/FWGS/xash3d-fwgs.git \
            engine/xash3d-fwgs

      - name: Configure Xash3D for iOS
        run: |
          cd engine/xash3d-fwgs

          ./waf configure \
            --ios \
            --enable-bundled-deps \
            --sdl2 "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework"

      - name: Build Xash3D
        run: |
          cd engine/xash3d-fwgs
          ./waf build

      - name: Clone CS16 Client
        run: |
          git clone --recursive \
            https://github.com/Velaron/cs16-client.git \
            cs16-client

      - name: Configure CS16 Client for iOS arm64
        run: |
          cmake \
            -S cs16-client \
            -B cs16-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DFREETYPE_LIBRARY="$GITHUB_WORKSPACE/freetype-ios/lib/libfreetype.a" \
            -DFREETYPE_INCLUDE_DIRS="$GITHUB_WORKSPACE/freetype-ios/include/freetype2" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build CS16 Client
        run: |
          cmake \
            --build cs16-build \
            --config Release

      - name: Prepare Xash3D iOS bundle
        run: |
          cd engine/xash3d-fwgs

          rm -rf build/ios
          mkdir -p build/ios/libs/cstrike/cl_dlls
          mkdir -p build/ios/libs/cstrike/dlls

          cp -R \
            "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework" \
            build/

          echo "===== COPYING CS16 CLIENT ====="

          cp "$GITHUB_WORKSPACE/cs16-build/3rdparty/mainui_cpp/Release-iphoneos/menu_arm64.dylib" \
            build/ios/libs/cstrike/cl_dlls/menu_arm64.dylib

          cp "$GITHUB_WORKSPACE/cs16-build/3rdparty/mainui_cpp/Release-iphoneos/client_arm64.dylib" \
            build/ios/libs/cstrike/cl_dlls/client_arm64.dylib

          cp "$GITHUB_WORKSPACE/cs16-build/3rdparty/mainui_cpp/Release-iphoneos/cs_arm64.dylib" \
            build/ios/libs/cstrike/dlls/cs_arm64.dylib

          cp "$GITHUB_WORKSPACE/cs16-build/3rdparty/mainui_cpp/Release-iphoneos/yapb_arm64.dylib" \
            build/ios/libs/cstrike/dlls/yapb_arm64.dylib

          echo "===== CHECK CS16 FILES ====="
          find build/ios -type f -print

      - name: Create IPA
        run: |
          cd engine/xash3d-fwgs

          chmod +x scripts/ios/createipa.sh

          ./scripts/ios/createipa.sh

          mv build/xash3d.ipa \
            "$GITHUB_WORKSPACE/xash3d-cs16-ios-arm64.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-cs16-ios-ipa
          path: xash3d-cs16-ios-arm64.ipa
