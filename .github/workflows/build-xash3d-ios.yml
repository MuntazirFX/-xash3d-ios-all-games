name: Build Xash3D All Games iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          brew install cmake ninja python

          brew uninstall --ignore-dependencies freetype || true
          brew uninstall --ignore-dependencies harfbuzz || true


      # =========================================================
      # 3. iOS CMAKE TOOLCHAIN
      # =========================================================
      - name: Clone ios-cmake
        run: |
          git clone --depth 1 \
            https://github.com/leetal/ios-cmake.git


      # =========================================================
      # 4. FREETYPE FOR iOS ARM64
      # =========================================================
      - name: Build FreeType for iOS arm64
        run: |
          set -e

          git clone --depth 1 \
            --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git \
            freetype

          cmake \
            -S freetype \
            -B freetype-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/freetype-ios" \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE

          cmake \
            --build freetype-build \
            --config Release

          cmake \
            --install freetype-build \
            --config Release

          echo "===== FREETYPE ====="

          find "$GITHUB_WORKSPACE/freetype-ios" \
            -type f \
            -name "*.a" \
            -print


      # =========================================================
      # 5. SDL2
      # =========================================================
      - name: Clone SDL2
        run: |
          git clone \
            --depth 1 \
            --branch SDL2 \
            --recursive \
            https://github.com/libsdl-org/SDL.git \
            SDL


      # =========================================================
      # 6. BUILD SDL2 iOS FRAMEWORK
      # =========================================================
      - name: Build SDL2 iOS framework
        run: |
          set -e

          cd SDL/Xcode/SDL

          xcodebuild \
            -project SDL.xcodeproj \
            -scheme "Framework-iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/sdl-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          test -d \
            "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework"

          echo "===== SDL2 READY ====="


      # =========================================================
      # 7. XASH3D FWGS
      # =========================================================
      - name: Clone Xash3D FWGS
        run: |
          mkdir -p engine

          git clone \
            --recursive \
            https://github.com/FWGS/xash3d-fwgs.git \
            engine/xash3d-fwgs


      # =========================================================
      # 8. CONFIGURE XASH3D
      # =========================================================
      - name: Configure Xash3D for iOS
        run: |
          set -e

          cd engine/xash3d-fwgs

          ./waf configure \
            --ios \
            --enable-bundled-deps \
            --sdl2 "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework"


      # =========================================================
      # 9. BUILD XASH3D
      # =========================================================
      - name: Build Xash3D
        run: |
          set -e

          cd engine/xash3d-fwgs

          ./waf build


      # =========================================================
      # 10. CLONE CS16 CLIENT
      # =========================================================
      - name: Clone CS16 Client
        run: |
          git clone \
            --recursive \
            https://github.com/Velaron/cs16-client.git \
            cs16-client


      # =========================================================
      # 11. CONFIGURE CS16 CLIENT
      # =========================================================
      - name: Configure CS16 Client for iOS arm64
        run: |
          set -e

          cmake \
            -S cs16-client \
            -B cs16-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DFREETYPE_LIBRARY="$GITHUB_WORKSPACE/freetype-ios/lib/libfreetype.a" \
            -DFREETYPE_INCLUDE_DIRS="$GITHUB_WORKSPACE/freetype-ios/include/freetype2" \
            -DCMAKE_BUILD_TYPE=Release


      # =========================================================
      # 12. BUILD CS16
      # =========================================================
      - name: Build CS16 Client
        run: |
          set -e

          cmake \
            --build cs16-build \
            --config Release


      # =========================================================
      # 13. LOCATE CS16 LIBRARIES
      # =========================================================
      - name: Locate CS16 libraries
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING CS16 LIBRARIES"
          echo "======================================"

          find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            \( \
              -name "client_arm64.dylib" \
              -o -name "menu_arm64.dylib" \
              -o -name "cs_arm64.dylib" \
              -o -name "yapb_arm64.dylib" \
            \) \
            -print

          CLIENT=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "client_arm64.dylib" \
            | head -n 1)

          MENU=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "menu_arm64.dylib" \
            | head -n 1)

          CS=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "cs_arm64.dylib" \
            | head -n 1)

          YAPB=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "yapb_arm64.dylib" \
            | head -n 1)

          echo "CLIENT=$CLIENT"
          echo "MENU=$MENU"
          echo "CS=$CS"
          echo "YAPB=$YAPB"

          test -f "$CLIENT"
          test -f "$MENU"
          test -f "$CS"

          echo "CS16 libraries found successfully."


      # =========================================================
      # 14. PREPARE iOS BUILD
      # =========================================================
      - name: Prepare Xash3D iOS bundle
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          BUILDDIR="$ENGINE/build"

          echo "======================================"
          echo "PREPARING XASH3D iOS BUNDLE"
          echo "======================================"

          rm -rf "$BUILDDIR/ios"

          mkdir -p \
            "$BUILDDIR/ios/libs/cstrike/cl_dlls" \
            "$BUILDDIR/ios/libs/cstrike/dlls"


          # -----------------------------------------------------
          # SDL2
          # -----------------------------------------------------
          echo "Copying SDL2.framework..."

          rm -rf "$BUILDDIR/SDL2.framework"

          cp -R \
            "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework" \
            "$BUILDDIR/SDL2.framework"


          # -----------------------------------------------------
          # LOCATE CS16 LIBRARIES
          # -----------------------------------------------------
          CLIENT=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "client_arm64.dylib" \
            | head -n 1)

          MENU=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "menu_arm64.dylib" \
            | head -n 1)

          CS=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "cs_arm64.dylib" \
            | head -n 1)

          YAPB=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "yapb_arm64.dylib" \
            | head -n 1)


          # -----------------------------------------------------
          # VERIFY
          # -----------------------------------------------------
          test -f "$CLIENT"
          test -f "$MENU"
          test -f "$CS"


          # -----------------------------------------------------
          # CS16 CLIENT LIBRARIES
          # -----------------------------------------------------
          cp "$CLIENT" \
            "$BUILDDIR/ios/libs/cstrike/cl_dlls/client_arm64.dylib"

          cp "$MENU" \
            "$BUILDDIR/ios/libs/cstrike/cl_dlls/menu_arm64.dylib"


          # -----------------------------------------------------
          # CS16 SERVER LIBRARY
          # -----------------------------------------------------
          cp "$CS" \
            "$BUILDDIR/ios/libs/cstrike/dlls/cs_arm64.dylib"


          # -----------------------------------------------------
          # YaPB
          # -----------------------------------------------------
          if [ -n "$YAPB" ] && [ -f "$YAPB" ]; then
            cp "$YAPB" \
              "$BUILDDIR/ios/libs/cstrike/dlls/yapb_arm64.dylib"
          fi


          # =====================================================
          # GAME DATA
          #
          # Put your own legally obtained game folders in:
          #
          # games/valve
          # games/valve_hd
          # games/cstrike
          # games/cstrike_hd
          #
          # They will be copied into build/ios/
          # =====================================================

          echo "======================================"
          echo "COPYING GAME DATA"
          echo "======================================"


          for GAME in valve valve_hd cstrike cstrike_hd; do

            if [ -d "$GITHUB_WORKSPACE/games/$GAME" ]; then

              echo "Found $GAME"

              rm -rf "$BUILDDIR/ios/$GAME"

              cp -R \
                "$GITHUB_WORKSPACE/games/$GAME" \
                "$BUILDDIR/ios/$GAME"

            else

              echo "WARNING: games/$GAME not found."

            fi

          done


          # -----------------------------------------------------
          # VERIFY IMPORTANT CS16 FILE
          # -----------------------------------------------------
          if [ -f "$BUILDDIR/ios/cstrike/cstrike.extras.pak" ]; then
            echo "cstrike.extras.pak FOUND"
          else
            echo "cstrike.extras.pak not found - continuing"
          fi


          # -----------------------------------------------------
          # FINAL STRUCTURE
          # -----------------------------------------------------
          echo ""
          echo "======================================"
          echo "GAME DATA"
          echo "======================================"

          find "$BUILDDIR/ios" \
            -maxdepth 2 \
            -type d \
            -print

          echo ""
          echo "======================================"
          echo "GAME LIBRARIES"
          echo "======================================"

          find "$BUILDDIR/ios/libs" \
            -type f \
            -print


      # =========================================================
      # 15. CREATE IPA
      # =========================================================
      - name: Create IPA
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/engine/xash3d-fwgs"

          chmod +x scripts/ios/createipa.sh

          ./scripts/ios/createipa.sh

          test -f build/xash3d.ipa

          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh build/xash3d.ipa


      # =========================================================
      # 16. INSPECT IPA
      # =========================================================
      - name: Inspect IPA
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/engine/xash3d-fwgs/build"

          echo "======================================"
          echo "IPA CONTENTS"
          echo "======================================"

          unzip -l xash3d.ipa

          echo ""
          echo "======================================"
          echo "GAME FOLDERS"
          echo "======================================"

          unzip -l xash3d.ipa \
            | grep -E \
              'valve/|valve_hd/|cstrike/|cstrike_hd/' \
            || true

          echo ""
          echo "======================================"
          echo "IPA SIZE"
          echo "======================================"

          ls -lh xash3d.ipa


      # =========================================================
      # 17. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-all-games-ios-ipa
          path: engine/xash3d-fwgs/build/xash3d.ipa
          if-no-files-found: error
