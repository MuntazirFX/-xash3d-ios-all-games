name: Build Xash3D All Games iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          brew install cmake ninja python

          brew uninstall --ignore-dependencies freetype || true
          brew uninstall --ignore-dependencies harfbuzz || true


      # =========================================================
      # 3. iOS CMAKE TOOLCHAIN
      # =========================================================
      - name: Clone ios-cmake
        run: |
          git clone --depth 1 \
            https://github.com/leetal/ios-cmake.git


      # =========================================================
      # 4. FREETYPE
      # =========================================================
      - name: Build FreeType for iOS arm64
        run: |
          set -e

          git clone --depth 1 \
            --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git \
            freetype

          cmake \
            -S freetype \
            -B freetype-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/freetype-ios" \
            -DFT_DISABLE_PNG=TRUE \
            -DFT_DISABLE_ZLIB=TRUE \
            -DFT_DISABLE_BZIP2=TRUE \
            -DFT_DISABLE_HARFBUZZ=TRUE \
            -DFT_DISABLE_BROTLI=TRUE

          cmake --build freetype-build --config Release
          cmake --install freetype-build --config Release

          test -f "$GITHUB_WORKSPACE/freetype-ios/lib/libfreetype.a"


      # =========================================================
      # 5. SDL2
      # =========================================================
      - name: Clone SDL2
        run: |
          git clone --depth 1 \
            --branch SDL2 \
            --recursive \
            https://github.com/libsdl-org/SDL.git \
            SDL


      # =========================================================
      # 6. BUILD SDL2
      # =========================================================
      - name: Build SDL2 iOS framework
        run: |
          set -e

          cd SDL/Xcode/SDL

          xcodebuild \
            -project SDL.xcodeproj \
            -scheme "Framework-iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/sdl-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          test -d \
            "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework"


      # =========================================================
      # 7. XASH3D
      # =========================================================
      - name: Clone Xash3D FWGS
        run: |
          set -e

          mkdir -p engine

          git clone --recursive \
            https://github.com/FWGS/xash3d-fwgs.git \
            engine/xash3d-fwgs


      # =========================================================
      # 8. CONFIGURE XASH3D
      # =========================================================
      - name: Configure Xash3D for iOS
        run: |
          set -e

          cd engine/xash3d-fwgs

          ./waf configure \
            --ios \
            --enable-bundled-deps \
            --sdl2 "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework"


      # =========================================================
      # 9. BUILD XASH3D
      # =========================================================
      - name: Build Xash3D
        run: |
          set -e

          cd engine/xash3d-fwgs

          ./waf build


      # =========================================================
      # 10. CLONE HALF-LIFE SDK
      # =========================================================
      - name: Clone Half-Life SDK
        run: |
          set -e

          git clone --recursive \
            --branch mobile_hacks \
            https://github.com/FWGS/hlsdk-portable.git \
            hlsdk


      # =========================================================
      # 11. BUILD HALF-LIFE VALVE ARM64
      #
      # IMPORTANT:
      # NO -G Xcode HERE
      # This prevents Xcode signing errors.
      # =========================================================
      - name: Build Half-Life valve ARM64
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          IOSDIR="$ENGINE/build/ios"
          LIBSDIR="$IOSDIR/libs"

          echo "======================================"
          echo "BUILDING HALF-LIFE VALVE ARM64"
          echo "======================================"

          mkdir -p "$LIBSDIR"

          cd "$GITHUB_WORKSPACE/hlsdk"

          rm -rf build

          cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="$LIBSDIR" \
            -DGAMEDIR=valve \
            -DCMAKE_BUILD_TYPE=Debug \
            -B build \
            -S .

          cmake \
            --build build \
            --target install

          echo "======================================"
          echo "HALF-LIFE LIBRARIES"
          echo "======================================"

          find "$LIBSDIR/valve" \
            -type f \
            \( -name "*.dylib" -o -name "*.a" \) \
            -print


      # =========================================================
      # 12. VERIFY HALF-LIFE
      # =========================================================
      - name: Verify Half-Life ARM64 libraries
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          LIBSDIR="$ENGINE/build/ios/libs"

          echo "======================================"
          echo "CHECKING HALF-LIFE LIBRARIES"
          echo "======================================"

          find "$LIBSDIR/valve" \
            -type f \
            -name "*.dylib" \
            -print

          CLIENT=$(find "$LIBSDIR/valve" \
            -type f \
            -name "client_arm64.dylib" \
            | head -n 1)

          HL=$(find "$LIBSDIR/valve" \
            -type f \
            -name "hl_arm64.dylib" \
            | head -n 1)

          echo "CLIENT = $CLIENT"
          echo "HL     = $HL"

          test -f "$CLIENT"
          test -f "$HL"

          file "$CLIENT"
          file "$HL"


      # =========================================================
      # 13. CLONE CS16
      # =========================================================
      - name: Clone CS16 Client
        run: |
          set -e

          git clone --recursive \
            https://github.com/Velaron/cs16-client.git \
            cs16-client


      # =========================================================
      # 14. CONFIGURE CS16
      # =========================================================
      - name: Configure CS16 Client for iOS arm64
        run: |
          set -e

          cmake \
            -S cs16-client \
            -B cs16-build \
            -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios-cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=13.0 \
            -DENABLE_BITCODE=0 \
            -DFREETYPE_LIBRARY="$GITHUB_WORKSPACE/freetype-ios/lib/libfreetype.a" \
            -DFREETYPE_INCLUDE_DIRS="$GITHUB_WORKSPACE/freetype-ios/include/freetype2" \
            -DCMAKE_BUILD_TYPE=Release


      # =========================================================
      # 15. BUILD CS16
      # =========================================================
      - name: Build CS16 Client
        run: |
          set -e

          cmake \
            --build cs16-build \
            --config Release


      # =========================================================
      # 16. LOCATE CS16 LIBRARIES
      # =========================================================
      - name: Locate CS16 libraries
        run: |
          set -e

          find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            \( \
              -name "client_arm64.dylib" \
              -o -name "menu_arm64.dylib" \
              -o -name "cs_arm64.dylib" \
              -o -name "yapb_arm64.dylib" \
            \) \
            -print

          CLIENT=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "client_arm64.dylib" \
            | head -n 1)

          MENU=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "menu_arm64.dylib" \
            | head -n 1)

          CS=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "cs_arm64.dylib" \
            | head -n 1)

          YAPB=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "yapb_arm64.dylib" \
            | head -n 1)

          echo "CLIENT=$CLIENT"
          echo "MENU=$MENU"
          echo "CS=$CS"
          echo "YAPB=$YAPB"

          test -n "$CLIENT"
          test -n "$MENU"
          test -n "$CS"


      # =========================================================
      # 17. PREPARE GAME DIRECTORIES
      # =========================================================
      - name: Prepare Xash3D game directories
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          IOSDIR="$ENGINE/build/ios"
          LIBSDIR="$IOSDIR/libs"

          echo "======================================"
          echo "PREPARING GAME DIRECTORIES"
          echo "======================================"

          mkdir -p \
            "$LIBSDIR/valve/cl_dlls" \
            "$LIBSDIR/valve/dlls" \
            "$LIBSDIR/valve_hd/cl_dlls" \
            "$LIBSDIR/valve_hd/dlls" \
            "$LIBSDIR/cstrike/cl_dlls" \
            "$LIBSDIR/cstrike/dlls" \
            "$LIBSDIR/cstrike_hd/cl_dlls" \
            "$LIBSDIR/cstrike_hd/dlls"


      # =========================================================
      # 18. COPY HALF-LIFE LIBRARIES
      # =========================================================
      - name: Install Half-Life libraries
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          LIBSDIR="$ENGINE/build/ios/libs"

          HL_CLIENT="$LIBSDIR/valve/cl_dlls/client_arm64.dylib"
          HL_SERVER="$LIBSDIR/valve/dlls/hl_arm64.dylib"

          test -f "$HL_CLIENT"
          test -f "$HL_SERVER"

          cp "$HL_CLIENT" \
            "$LIBSDIR/valve_hd/cl_dlls/client_arm64.dylib"

          cp "$HL_SERVER" \
            "$LIBSDIR/valve_hd/dlls/hl_arm64.dylib"

          echo "Half-Life valve:"
          find "$LIBSDIR/valve" -type f -print

          echo "Half-Life valve_hd:"
          find "$LIBSDIR/valve_hd" -type f -print


      # =========================================================
      # 19. COPY CS16 LIBRARIES
      # =========================================================
      - name: Install CS16 libraries
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          LIBSDIR="$ENGINE/build/ios/libs"

          CLIENT=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "client_arm64.dylib" \
            | head -n 1)

          MENU=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "menu_arm64.dylib" \
            | head -n 1)

          CS=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "cs_arm64.dylib" \
            | head -n 1)

          YAPB=$(find "$GITHUB_WORKSPACE/cs16-build" \
            -type f \
            -name "yapb_arm64.dylib" \
            | head -n 1)

          test -f "$CLIENT"
          test -f "$MENU"
          test -f "$CS"

          # CS16
          cp "$CLIENT" \
            "$LIBSDIR/cstrike/cl_dlls/client_arm64.dylib"

          cp "$MENU" \
            "$LIBSDIR/cstrike/cl_dlls/menu_arm64.dylib"

          cp "$CS" \
            "$LIBSDIR/cstrike/dlls/cs_arm64.dylib"

          # CS16 HD
          cp "$CLIENT" \
            "$LIBSDIR/cstrike_hd/cl_dlls/client_arm64.dylib"

          cp "$MENU" \
            "$LIBSDIR/cstrike_hd/cl_dlls/menu_arm64.dylib"

          cp "$CS" \
            "$LIBSDIR/cstrike_hd/dlls/cs_arm64.dylib"

          if [ -n "$YAPB" ] && [ -f "$YAPB" ]; then

            cp "$YAPB" \
              "$LIBSDIR/cstrike/dlls/yapb_arm64.dylib"

            cp "$YAPB" \
              "$LIBSDIR/cstrike_hd/dlls/yapb_arm64.dylib"

          fi

          echo "======================================"
          echo "CS16 FILES"
          echo "======================================"

          find "$LIBSDIR/cstrike" \
            -type f \
            -print

          echo "======================================"
          echo "CS16 HD FILES"
          echo "======================================"

          find "$LIBSDIR/cstrike_hd" \
            -type f \
            -print


      # =========================================================
      # 20. OPTIONAL GAME DATA
      #
      # Put your own game files in:
      #
      # game-data/valve/
      # game-data/valve_hd/
      # game-data/cstrike/
      # game-data/cstrike_hd/
      # game-data/custom/<game-name>/
      #
      # =========================================================
      - name: Install game data
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          IOSDIR="$ENGINE/build/ios"

          if [ -d "$GITHUB_WORKSPACE/game-data" ]; then

            echo "======================================"
            echo "COPYING GAME DATA"
            echo "======================================"

            cp -R \
              "$GITHUB_WORKSPACE/game-data/." \
              "$IOSDIR/" \
              2>/dev/null || true

          else

            echo "No game-data directory found."
            echo "Skipping game data."

          fi


      # =========================================================
      # 21. SHOW FINAL FILE TREE
      # =========================================================
      - name: Verify final game libraries
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"

          echo "======================================"
          echo "FINAL IOS LIBRARY TREE"
          echo "======================================"

          find "$ENGINE/build/ios/libs" \
            -type f \
            -print \
            | sort

          echo "======================================"
          echo "VALVE"
          echo "======================================"

          find "$ENGINE/build/ios/libs/valve" \
            -type f \
            -print

          echo "======================================"
          echo "VALVE HD"
          echo "======================================"

          find "$ENGINE/build/ios/libs/valve_hd" \
            -type f \
            -print

          echo "======================================"
          echo "CSTRIKE"
          echo "======================================"

          find "$ENGINE/build/ios/libs/cstrike" \
            -type f \
            -print

          echo "======================================"
          echo "CSTRIKE HD"
          echo "======================================"

          find "$ENGINE/build/ios/libs/cstrike_hd" \
            -type f \
            -print


      # =========================================================
      # 22. COPY SDL2 FRAMEWORK
      # =========================================================
      - name: Install SDL2 framework
        run: |
          set -e

          ENGINE="$GITHUB_WORKSPACE/engine/xash3d-fwgs"
          BUILDDIR="$ENGINE/build"

          rm -rf "$BUILDDIR/SDL2.framework"

          cp -R \
            "$GITHUB_WORKSPACE/sdl-build/Build/Products/Release-iphoneos/SDL2.framework" \
            "$BUILDDIR/SDL2.framework"

          test -d "$BUILDDIR/SDL2.framework"


      # =========================================================
      # 23. CREATE IPA
      # =========================================================
      - name: Create IPA
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/engine/xash3d-fwgs"

          chmod +x scripts/ios/createipa.sh

          ./scripts/ios/createipa.sh

          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh build/xash3d.ipa

          test -f build/xash3d.ipa


      # =========================================================
      # 24. INSPECT IPA
      # =========================================================
      - name: Inspect IPA
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/engine/xash3d-fwgs/build"

          unzip -l xash3d.ipa

          ls -lh xash3d.ipa


      # =========================================================
      # 25. UPLOAD IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-all-games-ios-ipa
          path: engine/xash3d-fwgs/build/xash3d.ipa
          if-no-files-found: error
